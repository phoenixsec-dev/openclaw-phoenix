# mTLS variant. This is the enable-TLS-when-crossing-a-wire pattern: gateway
# traffic to Phoenix is encrypted (https:// + CA cert), with client
# certificates layered on top for machine identity. Prefer this whenever
# gateway-to-Phoenix traffic leaves loopback and the bridge is not a trusted
# single-host lab network. Phoenix is LAN-scoped; WAN exposure is unsupported.
services:
  phoenix:
    image: ghcr.io/phoenixsec-dev/phoenix:latest
    container_name: phoenix
    ports:
      - "9090:9090"
    restart: unless-stopped

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    depends_on:
      - phoenix
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PHOENIX_SERVER: "https://phoenix:9090"
      PHOENIX_CA_CERT: "/run/phoenix/ca.crt"
      PHOENIX_CLIENT_CERT: "/run/phoenix/client.crt"
      PHOENIX_CLIENT_KEY: "/run/phoenix/client.key"
    volumes:
      - ../../:/plugins/openclaw-phoenix:ro
      - ./openclaw.jsonc:/root/.openclaw/openclaw.jsonc:ro
      # Host token/seal-key files must be chmod 600-style before mounting; :ro is not enough.
      - ${PHOENIX_TOKEN_FILE_MAIN_HOST}:${PHOENIX_TOKEN_FILE_MAIN}:ro
      - ${PHOENIX_TOKEN_FILE_EXAMPLE_AGENT_HOST}:${PHOENIX_TOKEN_FILE_EXAMPLE_AGENT}:ro
      - ${PHOENIX_TOKEN_FILE_MY_AGENT_HOST}:${PHOENIX_TOKEN_FILE_MY_AGENT}:ro
      - ${PHOENIX_SEAL_KEY_MAIN_HOST}:${PHOENIX_SEAL_KEY_MAIN}:ro
      - ${PHOENIX_SEAL_KEY_EXAMPLE_AGENT_HOST}:${PHOENIX_SEAL_KEY_EXAMPLE_AGENT}:ro
      - ${PHOENIX_SEAL_KEY_MY_AGENT_HOST}:${PHOENIX_SEAL_KEY_MY_AGENT}:ro
      - /path/to/phoenix-ca.crt:/run/phoenix/ca.crt:ro
      - /path/to/openclaw-client.crt:/run/phoenix/client.crt:ro
      - /path/to/openclaw-client.key:/run/phoenix/client.key:ro
    restart: unless-stopped
