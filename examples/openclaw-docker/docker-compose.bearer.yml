services:
  phoenix:
    image: ghcr.io/phoenixsec-dev/phoenix:latest
    container_name: phoenix
    ports:
      - "9090:9090"
    restart: unless-stopped

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    depends_on:
      - phoenix
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-8080}:8080"
    environment:
      PHOENIX_SERVER: "${PHOENIX_SERVER}"
      PHOENIX_TOKEN: "${PHOENIX_TOKEN}"
      PHOENIX_DEFAULT_NAMESPACE: "${PHOENIX_DEFAULT_NAMESPACE}"
      PHOENIX_SEAL_MODE: "${PHOENIX_SEAL_MODE}"
    volumes:
      - ../../:/plugins/openclaw-phoenix:ro
      - ./openclaw.jsonc:/root/.openclaw/openclaw.jsonc:ro
    restart: unless-stopped
