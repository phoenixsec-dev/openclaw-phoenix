# Bearer-token variant. PHOENIX_SERVER comes from .env and defaults to
# http://phoenix:9090 — plaintext across the Compose bridge (a non-loopback
# wire); the plugin logs a transport security warning for it. Acceptable only
# for a trusted single-host lab stack. When traffic crosses a real wire, use
# docker-compose.mtls.yml (or https:// + PHOENIX_CA_CERT). See README.md.
services:
  phoenix:
    image: ghcr.io/phoenixsec-dev/phoenix:latest
    container_name: phoenix
    ports:
      - "9090:9090"
    restart: unless-stopped

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    depends_on:
      - phoenix
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ../../:/plugins/openclaw-phoenix:ro
      - ./openclaw.jsonc:/root/.openclaw/openclaw.jsonc:ro
      # Host token/seal-key files must be chmod 600-style before mounting; :ro is not enough.
      - ${PHOENIX_TOKEN_FILE_MAIN_HOST}:${PHOENIX_TOKEN_FILE_MAIN}:ro
      - ${PHOENIX_TOKEN_FILE_EXAMPLE_AGENT_HOST}:${PHOENIX_TOKEN_FILE_EXAMPLE_AGENT}:ro
      - ${PHOENIX_TOKEN_FILE_MY_AGENT_HOST}:${PHOENIX_TOKEN_FILE_MY_AGENT}:ro
      - ${PHOENIX_SEAL_KEY_MAIN_HOST}:${PHOENIX_SEAL_KEY_MAIN}:ro
      - ${PHOENIX_SEAL_KEY_EXAMPLE_AGENT_HOST}:${PHOENIX_SEAL_KEY_EXAMPLE_AGENT}:ro
      - ${PHOENIX_SEAL_KEY_MY_AGENT_HOST}:${PHOENIX_SEAL_KEY_MY_AGENT}:ro
    restart: unless-stopped
